apis:
- aid: sequence-hq:sequence-hq-customers-api
  name: Sequence Customers API
  tags:
  - Customers
  - Contacts
  - Billing
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
