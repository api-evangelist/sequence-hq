aid: sequence-hq
url: https://raw.githubusercontent.com/api-evangelist/sequence-hq/refs/heads/main/apis.yml
name: Sequence
kind: company
description: Sequence is a usage-based billing, pricing, and revenue orchestration
  platform for B2B SaaS and other recurring-revenue businesses. It turns product
  usage and negotiated contract terms into automated billing schedules, invoices,
  credit notes, and quotes, backed by a metering engine for usage events and usage
  metrics, plus revenue recognition and integrations to ERP/CRM, tax, and payment
  providers. The REST API (production base https://eu.sequencehq.com) uses HTTP
  Basic authentication with a Client ID and Client Secret, date-based API
  versioning (for example sequence-version 2024-07-30), and signed webhooks for
  event notifications. A Sandbox environment (https://sandbox.sequencehq.com)
  mirrors production for testing.
