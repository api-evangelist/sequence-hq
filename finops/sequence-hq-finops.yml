meters:
- name: platform_fee
  description: Monthly platform subscription fee, scaled by tier (Growth / Core / Scale) and projected billed revenue.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - tier
- name: add_ons
  description: Optional add-on modules such as quote builder, custom reporting, and revenue recognition.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - module
- name: professional_services
  description: One-time or recurring services such as onboarding, migration, and dedicated engineer support (Scale).
  unit: engagement
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track the Sequence platform tier and enabled add-ons as a fixed monthly line item; review it against the projected billed revenue the fee was priced on.
- name: Allocation
  description: Attribute the Sequence subscription to the finance/revenue-operations cost center it serves, and use Sequence's own usage/invoice data to allocate customer revenue downstream.
- name: Optimization
  description: Right-size the tier to actual billed revenue and only enable add-ons in use; consolidate quoting, metering, invoicing, and revenue recognition onto one platform to avoid overlapping point tools.
- name: Accountability
  description: Assign a finance owner to review the tier annually as billed revenue grows and tiers change, and to confirm add-ons remain justified.
