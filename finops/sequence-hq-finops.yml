description: >-
  FinOps view of Sequence spend. Sequence is a SaaS platform billed as a monthly
  platform fee that scales with your projected billed revenue and the feature
  set you enable (Growth / Core / Scale), not as a per-API-call charge. The
  dominant cost driver is the platform subscription tier; optional add-ons
  (quote builder, custom reporting, revenue recognition) and professional
  services (onboarding, migration) can add to spend. Because Sequence is itself a
  billing and metering system, it also produces the usage, invoice, and revenue
  data other FinOps practices depend on downstream.
notes: >-
  Sequence's own tier fees beyond the published Growth price are bespoke and not
  reconciled here. This artifact models Sequence-as-a-vendor cost; verify tier
  fees and add-on pricing on https://www.sequencehq.com/pricing.
